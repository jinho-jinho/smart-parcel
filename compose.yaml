services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: smartparcel_db
      POSTGRES_USER: smartparcel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - parcel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartparcel -d smartparcel_db"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - parcel_redis:/data
volumes:
  parcel_postgres:
  parcel_redis:
